packages:
  - .

# Fail on a package-manager mismatch; never download or switch pnpm.
pmOnFail: error
# Preserve script denial; allowBuilds also documents dependency-specific denial.
ignoreScripts: true
# Do not introduce enforcement of the previously ignored .npmrc engine policy.
engineStrict: false

autoInstallPeers: false
enableGlobalVirtualStore: false

catalog:
  '@cloudflare/workers-types': 5.20261003.1

minimumReleaseAge: 4320

allowBuilds:
  esbuild: false
  workerd: false
