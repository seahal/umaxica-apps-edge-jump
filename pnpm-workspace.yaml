packages:
  - .

# Fail on a package-manager mismatch; never download or switch pnpm.
# pmOnFail: error
# Preserve script denial; allowBuilds also documents dependency-specific denial.
ignoreScripts: true
# Do not introduce enforcement of the previously ignored .npmrc engine policy.
engineStrict: false

autoInstallPeers: false
enableGlobalVirtualStore: false

catalog:
  '@cloudflare/workers-types': 5.20261024.1
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest: 5.1.0
  vite-plus: 1.5.0
  '@vitest/coverage-v8': 5.1.0

minimumReleaseAge: 4320

allowBuilds:
  esbuild: false
  workerd: false
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
