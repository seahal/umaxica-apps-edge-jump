name: 'Set up pnpm project'
description: 'Installs pnpm and Node from package.json, then performs a frozen install.'

runs:
  using: composite
  steps:
    # No `version:` input on purpose: pnpm/action-setup refuses to run when a
    # version is given here as well as in package.json's `packageManager`,
    # which stays the single source of truth for the pnpm version.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    # `engines.node` in package.json is an exact version, so CI runs the Node
    # the project declares instead of a separately maintained major.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
