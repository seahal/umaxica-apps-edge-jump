version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7

  # Workflow actions are pinned by commit SHA, which nothing updates on its
  # own — without this ecosystem they silently drift majors behind, which is
  # how every action in integration.yaml ended up on a deprecated Node 20
  # runtime.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
