name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-project
      - run: pnpm run format:check
      - run: pnpm run lint:check
      - run: pnpm run typecheck
      # oxc-parser's raw transfer reserves a ~6 GiB ArrayBuffer per parse
      # buffer, which the runner cannot allocate ("RangeError: Array buffer
      # allocation failed"). knip's own escape hatch falls back to the normal
      # parser; the run still finishes in under a second.
      - run: pnpm exec knip --include unlisted,unresolved,binaries
        env:
          KNIP_DISABLE_RAW_TRANSFER: '1'

  unit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-project
      # `test:cov` runs the same suite as `test`, with coverage on top.
      - run: pnpm run test:cov

  e2e:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-project
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e

  dependencies:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-project
      - run: pnpm audit --audit-level=high
      # Informational: a newer release upstream is not a reason to fail a build.
      - run: pnpm outdated
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cloudflare-dry-run:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-project
      - run: pnpm run cloudflare:check
      - name: Report Worker bundle size
        run: |
          test -d dist/cloudflare
          find dist/cloudflare -type f -printf '%P\t%s bytes\n' | sort
