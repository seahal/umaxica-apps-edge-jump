name: umaxica-apps-jump-dc
services:
  core:
    image: localhost/umaxica-apps-jump-dc-core
    build:
      args:
        DOCKER_UID: "${UID:-1000}"
        DOCKER_GID: "${GID:-1000}"
    userns_mode: keep-id
    # `userns_mode: keep-id` maps the host UID to the image user built from
    # DOCKER_UID/DOCKER_GID. Keeping compose's `user:` on top double-maps under
    # rootless podman and can make bind-mounted files appear owned by root.
    user: !reset null
    volumes: !override
      - type: bind
        source: "."
        target: "/home/jump/workspace"
        bind:
          selinux: Z
      - type: volume
        source: node-volume
        target: /home/jump/workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: vite-plus-volume
        target: /home/jump/.vite-plus
    ports: !override
      - '7676:7676' # jump/fastly
      - '8787:8787' # jump/cloudflare
      - '5101:5101' # com/apex
      - '5102:5102' # com/core
      - '5106:5106' # com/post
      - '5201:5201' # net/apex
      - '5301:5301' # org/apex
      - '5302:5302' # org/core
      - '5306:5306' # org/post
      - '5401:5401' # app/apex
      - '5402:5402' # app/core
      - '5406:5406' # app/post
    environment:
      - DEVCONTAINER=1
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
